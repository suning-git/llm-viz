# Build the static export and publish it to the gh-pages branch.
#
# WHY THIS EXISTS. The site is a Next.js static export, so what GitHub Pages
# serves is a *build product*, not the source. Producing it used to be a manual
# step on somebody's laptop: build, then push out/ to gh-pages. Pushing to main
# therefore did nothing to the live site, silently -- and on 2026-08-27 the
# deployed page turned out to be seven weeks behind the source, with no error
# anywhere to say so. This workflow makes the build a property of the repo
# instead of something a person has to remember, so main is the single source
# of truth again.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-deploy by hand from the Actions tab

permissions:
  contents: write           # needed to push the built site to gh-pages

concurrency:                # never let two deploys race each other
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build static export
        run: yarn build          # next.config.js has output:"export" -> writes ./out

      - name: Publish out/ to gh-pages
        run: |
          set -euo pipefail
          # .nojekyll is REQUIRED: without it Pages runs Jekyll, which drops every
          # directory starting with an underscore -- including _next/, i.e. all the
          # JS and CSS. The page would load as an unstyled skeleton.
          touch out/.nojekyll
          cd out
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          # Force-push: gh-pages holds only the current build, never history.
          # Keeping every past build would grow the repo by ~3 MB per deploy.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
